name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Fleet domain contracts
        run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Fleet domain contracts
        run: npm test
      - name: Validate repository
        run: |
          git diff --check
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -p 'test_*.py' -q
